<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#9a6b91"><title>Cliente · Luna Vital</title><link rel="stylesheet" href="styles.css?v=11"></head><body data-page="client"><main class="shell"><header class="topbar"><a class="back" href="debts.html">← Cuentas por cobrar</a><span id="connectionStatus" class="status">Conectando…</span></header><div class="page-title"><h1 id="clientNameTitle">Cliente</h1><p>Detalle de compras a crédito y pagos.</p></div><section class="detail-stats"><article><span>Total comprado</span><strong id="clientCreditTotal">₡0</strong></article><article><span>Total pagado</span><strong id="clientPaidTotal">₡0</strong></article><article><span>Saldo pendiente</span><strong id="clientPendingTotal">₡0</strong></article></section><section class="panel"><div class="detail-head"><div><h3>Compras a crédito</h3></div><button id="showPaymentButton" class="smallbtn">Registrar pago</button></div><div id="clientSalesHistory"></div></section><section class="panel"><h3>Historial de pagos</h3><div id="clientPaymentsHistory"></div></section><section id="paymentPanel" class="panel hidden"><h3>Registrar pago</h3><p id="paymentClientLabel"></p><div class="form-grid"><div class="field"><label>Monto recibido</label><div class="money"><span>₡</span><input id="paymentAmount" type="text" inputmode="numeric" placeholder="0"></div></div><div class="field"><label>Fecha</label><input id="paymentDate" type="date"></div><button id="savePaymentButton" class="primary">Guardar pago</button><p id="paymentMessage" class="message"></p></div></section></main>
<dialog id="editSaleDialog"><div class="dialog"><h3>Editar compra a crédito</h3><div class="form-grid"><div class="field"><label>Cliente</label><input id="editSaleClientName"></div><div class="field"><label>Artículo</label><select id="editSaleProduct"></select></div><div class="field"><label>Cantidad</label><input id="editSaleQuantity" type="number" min="1"></div><div class="field"><label>Monto</label><div class="money"><span>₡</span><input id="editSaleAmount"></div></div><div class="field"><label>Fecha</label><input id="editSaleDate" type="date"></div><p id="editSaleMessage" class="message"></p></div><div class="dialog-actions"><button id="cancelEditSaleButton" class="secondary">Cancelar</button><button id="saveEditSaleButton" class="primary">Guardar</button></div></div></dialog>
<dialog id="editPaymentDialog"><div class="dialog"><h3>Editar pago</h3><div class="form-grid"><div class="field"><label>Monto</label><div class="money"><span>₡</span><input id="editPaymentAmount"></div></div><div class="field"><label>Fecha</label><input id="editPaymentDate" type="date"></div><p id="editPaymentMessage" class="message"></p></div><div class="dialog-actions"><button id="cancelEditPaymentButton" class="secondary">Cancelar</button><button id="saveEditPaymentButton" class="primary">Guardar</button></div></div></dialog>
<script type="module" src="app.js?v=11"></script></body></html>
