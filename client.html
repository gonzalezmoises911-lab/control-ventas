<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#9a6b91"><title>Cliente · Luna Vital</title><link rel="stylesheet" href="styles.css?v=14"></head><body data-page="client"><main class="shell"><header class="topbar"><a class="back" href="debts.html">← Cuentas por cobrar</a><span id="connectionStatus" class="status">Conectando…</span></header><div class="page-title"><h1 id="clientNameTitle">Cliente</h1><p>Detalle de compras a crédito y pagos.</p></div><section class="detail-stats"><article><span>Total comprado</span><strong id="clientCreditTotal">₡0</strong></article><article><span>Total pagado</span><strong id="clientPaidTotal">₡0</strong></article><article><span>Saldo pendiente</span><strong id="clientPendingTotal">₡0</strong></article></section><section class="panel"><div class="detail-head"><div><h3>Compras a crédito</h3></div><button id="showPaymentButton" class="smallbtn">Registrar pago</button></div><div id="clientSalesHistory"></div></section><section class="panel"><h3>Historial de pagos</h3><div id="clientPaymentsHistory"></div></section><section id="paymentPanel" class="panel hidden"><h3>Registrar pago</h3><p id="paymentClientLabel"></p><div class="form-grid"><div class="field"><label>Monto recibido</label><div class="money"><span>₡</span><input id="paymentAmount" type="text" inputmode="numeric" placeholder="0"></div></div><div class="field"><label>Fecha</label><input id="paymentDate" type="date"></div><button id="savePaymentButton" class="primary">Guardar pago</button><p id="paymentMessage" class="message"></p></div></section></main>
<dialog id="editSaleDialog" aria-labelledby="editSaleTitle"><div class="dialog sale-dialog"><h3 id="editSaleTitle">Editar compra a crédito</h3>
<form id="editSaleForm" novalidate><fieldset id="editSaleFields" class="form-grid sale-fields">
<div class="field"><label for="editSaleClientName">Cliente</label><input id="editSaleClientName"></div>
<section id="editSaleProducts" class="sale-products" aria-label="Productos de la compra"><div id="editSaleItems" class="sale-items"></div><button id="addEditSaleItemButton" type="button" class="secondary add-product">+ Agregar otro producto</button><p id="editSaleItemsSummary" class="stock-hint" aria-live="polite"></p></section>
<p id="editSaleLegacy" class="stock-hint hidden"></p>
<div class="field"><label for="editSaleAmount">Monto total de la venta</label><div class="money"><span>₡</span><input id="editSaleAmount" inputmode="numeric"></div><small id="editSaleAmountHint" class="stock-hint"></small></div>
<div class="field"><label for="editSaleDate">Fecha</label><input id="editSaleDate" type="date"></div>
<div class="dialog-actions"><button id="cancelEditSaleButton" type="button" class="secondary">Cancelar</button><button id="saveEditSaleButton" type="submit" class="primary">Guardar</button></div>
</fieldset><p id="editSaleMessage" class="message" role="status"></p></form></div></dialog>
<dialog id="editPaymentDialog"><div class="dialog"><h3>Editar pago</h3><div class="form-grid"><div class="field"><label>Monto</label><div class="money"><span>₡</span><input id="editPaymentAmount"></div></div><div class="field"><label>Fecha</label><input id="editPaymentDate" type="date"></div><p id="editPaymentMessage" class="message"></p></div><div class="dialog-actions"><button id="cancelEditPaymentButton" class="secondary">Cancelar</button><button id="saveEditPaymentButton" class="primary">Guardar</button></div></div></dialog>
<script type="module" src="app.js?v=14"></script></body></html>
