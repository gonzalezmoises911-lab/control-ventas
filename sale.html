<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#c97f96"><title>Nueva Venta · Luna Vital</title><link rel="stylesheet" href="styles.css?v=11"></head><body data-page="sale"><main class="shell"><header class="topbar"><a class="back" href="menu.html">← Menú</a><span id="connectionStatus" class="status">Conectando…</span></header><div class="page-title"><h1>Registrar venta</h1><p>Guarda una venta pagada o a crédito.</p></div><section class="panel"><div class="form-grid"><div class="field"><label>Nombre del cliente</label><input id="clientName" type="text" placeholder="Ej. María Rodríguez"></div><div class="field"><label>Artículo</label><select id="article"><option value="">Seleccionar artículo…</option></select><small id="articleStockHint"></small></div><div class="field"><label>Cantidad</label><input id="saleQuantity" type="number" min="1" step="1" placeholder="1"></div><div class="field"><label>Monto total</label><div class="money"><span>₡</span><input id="saleAmount" type="text" inputmode="numeric" placeholder="0"></div></div><div class="field"><label>Fecha</label><input id="saleDate" type="date"></div><div class="field"><label>Estado</label><div class="segmented"><label><input type="radio" name="saleStatus" value="paid" checked><span>✓ Pagado</span></label><label><input type="radio" name="saleStatus" value="credit"><span>◷ A crédito</span></label></div></div><button id="saveSaleButton" class="primary">Guardar venta</button><p id="saleMessage" class="message"></p></div></section></main><script type="module" src="app.js?v=11"></script></body></html>
